# mcpp package for mo_yanxi.vulkan_wrapper (external/mo_yanxi_vulkan_wrapper).
#
# Transcribed from that repo's own xmake.lua:
#
#   add_files("./src/vk_wrap/**.cpp") / ("./src/vk_wrap/**.ixx")
#   add_includedirs("external/VulkanMemoryAllocator/include", {public = true})
#   add_includedirs($VULKAN_SDK/include, {public = true})   -> compat.vulkan instead
#   add_defines("VK_USE_64_BIT_PTR_DEFINES=1", {public = true})
#   MO_YANXI_VULKAN_WRAPPER_ENABLE_CHECK=0 on release
#   add_deps("mo_yanxi.utility")
#
# VMA comes from the checked-out submodule rather than compat.vulkan-memory-allocator
# on purpose: src/vk_wrap/util/vma.cpp already carries `#define VMA_IMPLEMENTATION`,
# so taking the package -- which compiles its own implementation TU -- would give
# every VMA symbol twice.
[package]
name    = "mo_yanxi_vulkan_wrapper"
version = "0.1.0"

[build]
module_extensions = [".ixx"]

sources = [
  "../../external/mo_yanxi_vulkan_wrapper/src/vk_wrap/**/*.ixx",
  "../../external/mo_yanxi_vulkan_wrapper/src/vk_wrap/**/*.cpp",
]

include_dirs = [
  "../../external/mo_yanxi_vulkan_wrapper/external/VulkanMemoryAllocator/include",
]

defines = [
  "VK_USE_64_BIT_PTR_DEFINES=1",
  "MO_YANXI_VULKAN_WRAPPER_ENABLE_CHECK=0",
]

[dependencies]
mo_yanxi_utility = { path = "../mo_yanxi_utility" }
compat.vulkan    = "1.4.357.0"

# stack_trace.cpp guards `import mo_yanxi.meta_programming;` behind
# `#if defined(__cpp_lib_stacktrace)`, which mcpp's M1 scanner rejects. This was
# briefly declared here as a `[scan_overrides]` entry instead of patched, and
# that is the wrong tool for THIS file. Measured, on clang/Linux:
#
#   error: module-graph divergence in obj/stack_trace.o:
#     planned : provides [<none>] imports [mo_yanxi.meta_programming]
#     compiler: provides [<none>] imports [mo_yanxi.stack_trace]
#
# Two things at once. An implementation unit imports the module it belongs to,
# so any correct declaration has to name `mo_yanxi.stack_trace` as well -- and
# more importantly, whether `mo_yanxi.meta_programming` is imported at all
# depends on `__cpp_lib_stacktrace`, which MSVC defines and this clang does not.
# A `[scan_overrides]` entry is one fixed answer, audited against the compiler
# every build; a conditional import has two. The override would have to be wrong
# on one of the two platforms, which is the opposite of what this port wants.
#
# mcpp/patches/ hoists the import out of the `#if` instead. That is true on
# every compiler, so it keeps the Linux leg reachable. The real fix is the same
# hoist upstream in mo_yanxi_vulkan_wrapper, after which the patch goes away.
