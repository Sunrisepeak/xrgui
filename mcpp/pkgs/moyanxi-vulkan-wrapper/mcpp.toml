# 过渡期薄包：manifest 住在 xrgui 仓库，源码指回 submodule。
# 见 .agents/docs/2026-08-12-mcpp-adaptation-design.md §4.3
#
# 上游 xmake.lua 里 add_links("vulkan-1") 是 Windows 库名，Linux 上是 vulkan；
# 这里改由 compat.vulkan 提供，链接名归包描述符管，跨平台坑自动消失。
# 同理 VULKAN_SDK 环境变量探测也不再需要。

[package]
name        = "vulkan_wrapper"
version     = "0.1.0"
standard    = "c++23"
description = "mo_yanxi Vulkan wrapper modules"
license     = "BSD-2-Clause"

[build]
module_extensions = [".ixx"]

sources = [
  "../../../external/mo_yanxi_vulkan_wrapper/src/vk_wrap/**/*.ixx",
  "../../../external/mo_yanxi_vulkan_wrapper/src/vk_wrap/**/*.cpp",
]

include_dirs = [
  "../../../external/mo_yanxi_vulkan_wrapper/external/VulkanMemoryAllocator/include",
]

defines = ["VK_USE_64_BIT_PTR_DEFINES=1", "MO_YANXI_VULKAN_WRAPPER_ENABLE_CHECK=0"]

cxxflags = ["-Wno-interference-size"]

[dependencies]
utility = { path = "../moyanxi-utility" }

[dependencies.compat]
vulkan = "1.4.357.0"

[targets.vulkan_wrapper]
kind = "lib"
